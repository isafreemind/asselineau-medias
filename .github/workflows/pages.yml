name: Publier la médiathèque
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installer FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - name: Construire les pages et contrôler les médias
        run: npm run build && npm run check:build
        env:
          GITHUB_PAGES_URL: ${{ steps.pages.outputs.base_url }}
      - name: Conserver le rapport de validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-medias
          path: reports/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
